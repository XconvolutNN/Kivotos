name: LXC

on:
  workflow_dispatch:
  push:
    branches:
      - feat/lxc-image
    paths:
      - Dockerfile
      - lxc/**
      - .github/workflows/lxc.yml

permissions:
  contents: read

concurrency:
  group: lxc-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  image:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # The rootfs is several GB extracted; reclaim the preinstalled toolchains first.
      - name: Disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          docker image prune -af || true
          df -h /

      - name: Blender LTS
        id: blender
        shell: bash
        run: python3 .github/scripts/resolve-blender-lts.py

      - name: Build
        shell: bash
        env:
          BLENDER_VERSION: ${{ steps.blender.outputs.version }}
        run: |
          command -v zstd >/dev/null || sudo apt-get install -y zstd
          sudo env BLENDER_VERSION="$BLENDER_VERSION" lxc/build.sh
          sudo chown -R "$(id -u):$(id -g)" dist
          df -h /

      - name: Inspect
        shell: bash
        run: |
          set -euo pipefail
          archive=$(ls dist/kivotos-lxc-*.tar.xz)
          rootfs=$(ls dist/kivotos-rootfs-*.tar.zst)
          echo "archive: $archive ($(du -h "$archive" | cut -f1))"
          echo "rootfs:  $rootfs ($(du -h "$rootfs" | cut -f1))"
          listing=$(tar -tJf "$archive")
          grep -qx 'metadata.yaml' <<< "$listing"
          grep -qx 'rootfs/sbin/init' <<< "$listing"
          grep -qx 'rootfs/etc/systemd/system/multi-user.target.wants/ssh.service' <<< "$listing"
          test -z "$(grep -E '^rootfs/(\.dockerenv|dev/[a-z])' <<< "$listing" || true)"
          zstd -dc "$rootfs" | tar -t | grep -qx './sbin/init'
          cat dist/*.sha256

      - name: Boot test (Incus)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y incus
          sudo incus admin init --minimal
          archive=$(ls "$PWD"/dist/kivotos-lxc-*.tar.xz)
          sudo incus image import "$archive" --alias kivotos
          sudo incus launch kivotos smoke

          ready=0
          for _ in $(seq 1 60); do
            if sudo incus exec smoke -- true >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            sudo incus info smoke || true
            exit 1
          fi

          sudo incus exec smoke -- systemctl is-system-running --wait || true
          for _ in $(seq 1 60); do
            if sudo incus exec smoke -- systemctl is-active --quiet ssh; then break; fi
            sleep 2
          done
          sudo incus exec smoke -- systemctl is-active ssh
          sudo incus exec smoke -- bash -euc '
            test "$(cat /proc/1/comm)" = systemd
            go version
            node --version
            npm --version
            uv --version
            python --version
            rustc --version
            cargo --version
            tmux -V
            btop --version
            gh --version
            /opt/blender/blender --version | head -1
            test "$(getent shadow root | cut -d: -f2)" = "!"
            test "$(locale charmap)" = UTF-8
            command -v ping traceroute tracert telnet dig nc ss
            /usr/sbin/sshd -T | grep -Fx "permitrootlogin no"
            /usr/sbin/sshd -T | grep -Fx "allowtcpforwarding yes"
            /usr/sbin/sshd -T | grep -Fx "gatewayports clientspecified"
          '

          # End-to-end: create a user, install a key, log in over SSH from the runner.
          sudo incus exec smoke -- bash -euc '
            useradd -m -s /bin/bash dev
            install -d -m 700 -o dev -g dev /home/dev/.ssh
            ssh-keygen -q -t ed25519 -N "" -C ci -f /tmp/ci_key
            install -m 600 -o dev -g dev /tmp/ci_key.pub /home/dev/.ssh/authorized_keys
          '
          sudo incus file pull smoke/tmp/ci_key /tmp/ci_key
          sudo chmod 600 /tmp/ci_key
          address=$(sudo incus list smoke --format csv -c 4 | cut -d' ' -f1 | head -1)
          echo "container address: $address"
          ssh -i /tmp/ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o BatchMode=yes -o ConnectTimeout=10 "dev@$address" \
            'go version && tmux -V && python --version'
          if ssh -i /tmp/ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o BatchMode=yes -o ConnectTimeout=10 "root@$address" true 2>/dev/null; then
            echo 'root login unexpectedly allowed' >&2
            exit 1
          fi

          sudo incus exec smoke -- bash -euc '
            test -s /etc/ssh/ssh_host_ed25519_key
            systemctl is-enabled --quiet ssh
            systemctl is-active --quiet ssh
          '
          sudo incus delete -f smoke
          sudo incus image delete kivotos

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: kivotos-lxc-image
          path: dist/kivotos-lxc-*.tar.xz*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload rootfs
        uses: actions/upload-artifact@v4
        with:
          name: kivotos-lxc-rootfs
          path: dist/kivotos-rootfs-*.tar.zst
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30