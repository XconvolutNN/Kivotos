name: Build and publish container

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Every Monday at 01:10 UTC; refresh floating stable/LTS toolchains.
    - cron: '10 1 * * 1'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  container:
    name: Build, test, and optionally publish (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # Stable action releases checked on 2026-11-04; pin full revisions.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalize GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate image tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Ubuntu Devbox
            org.opencontainers.image.description=Ubuntu 26.04 developer container with Blender, uv/Python, Go, Rust, Node.js, SSH/SFTP and networking tools
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for smoke tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-amd64
          # Only trusted main-branch builds update the shared cache.
          cache-to: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache-amd64,mode=max', steps.image.outputs.name) || '' }}
          tags: ubuntu-devbox:ci
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify tools, UTF-8, non-root access, and SSH configuration
        shell: bash
        run: |
          docker run --rm --entrypoint /bin/bash ubuntu-devbox:ci -euo pipefail -c '
            uv --version
            python --version
            python3 --version
            blender --version
            go version
            rustc --version
            cargo --version
            node --version
            npm --version
            btop --version
            nvtop --version
            test -z "$(getcap /usr/bin/nvtop)"
            test "$(locale charmap 2>&1)" = UTF-8
            command -v ping traceroute tracert telnet dig nc ip ss gcc g++ make

            useradd -m -s /bin/bash ciuser
            su - ciuser -c "uv --version && python --version && blender --version && go version && rustc --version && cargo --version && node --version && npm --version && btop --version && nvtop --version"
            test "$(su - ciuser -c "locale charmap" 2>&1)" = UTF-8
            su - ciuser -c "test ! -w /opt/rustup && test ! -w /opt/uv/python"

            mkdir -p /run/sshd
            ssh-keygen -A
            cmp /etc/ssh/sshd_config /usr/share/openssh/sshd_config
            /usr/sbin/sshd -t
            /usr/sbin/sshd -T > /tmp/sshd-effective
            grep -Fxq "permitrootlogin no" /tmp/sshd-effective
            grep -Fxq "pubkeyauthentication yes" /tmp/sshd-effective
            grep -Fxq "passwordauthentication no" /tmp/sshd-effective
            grep -Fxq "kbdinteractiveauthentication no" /tmp/sshd-effective
            grep -Fxq "x11forwarding no" /tmp/sshd-effective
            grep -Fxq "gatewayports clientspecified" /tmp/sshd-effective
            grep -Fxq "allowtcpforwarding yes" /tmp/sshd-effective
            grep -Fxq "allowstreamlocalforwarding yes" /tmp/sshd-effective
            grep -Fxq "permitopen any" /tmp/sshd-effective
            grep -Fxq "permitlisten any" /tmp/sshd-effective
            grep -Fxq "subsystem sftp /usr/lib/openssh/sftp-server" /tmp/sshd-effective
            test -x /usr/lib/openssh/sftp-server
          '

      # Re-tag/push the exact locally tested image; do not rebuild after tests.
      - name: Publish tested image to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker tag ubuntu-devbox:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
